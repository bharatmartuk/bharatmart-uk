<body class="bg-background min-h-screen flex flex-col font-body-lg text-on-surface">
<!-- Transactional Header: No Global Nav as per UX Goal -->
<header class="flex items-center justify-between px-margin-mobile h-16 w-full fixed top-0 z-50 bg-transparent">
<button class="p-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">BharatMart UK</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-grow flex items-center justify-center px-gutter pt-20 pb-12">
<!-- Auth Card -->
<div class="bg-surface-container-lowest w-full max-w-md rounded-xl shadow-[0px_8px_24px_rgba(51,48,42,0.08)] p-6 md:p-8 animate-in fade-in zoom-in duration-500">
<!-- Brand Logo Space -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-primary-container text-4xl">storefront</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Welcome to BharatMart</h1>
<p class="font-body-md text-on-surface-variant mt-1">Your local high street, digitally curated.</p>
</div>
<!-- Tabs -->
<div class="flex w-full bg-surface-container-low rounded-lg p-1 mb-8">
<button class="flex-1 py-2 font-label-md text-label-md text-on-surface-variant transition-all">Login</button>
<button class="flex-1 py-2 font-label-md text-label-md bg-surface-container-lowest text-primary font-bold rounded shadow-sm border border-outline-variant/20 transition-all">Register</button>
</div>
<!-- Registration Form -->
<form class="space-y-5">
<!-- Name Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md" placeholder="Arjun Singh" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md" placeholder="arjun@example.co.uk" type="email"/>
</div>
</div>
<!-- Phone Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Phone Number</label>
<div class="relative flex">
<div class="flex items-center px-3 bg-surface-container-high border border-outline-variant border-r-0 rounded-l-lg text-body-md text-on-surface-variant">
                            +44
                        </div>
<input class="w-full px-4 py-3 bg-surface rounded-r-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md" placeholder="7123 456789" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Create Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 pt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-secondary font-medium hover:underline" href="#">Terms of Service</a> and <a class="text-secondary font-medium hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full py-4 bg-primary text-on-primary font-bold rounded-lg shadow-lg hover:shadow-xl active:scale-95 transition-all mt-4 font-headline-md-mobile text-headline-md-mobile flex items-center justify-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8 text-center">
<hr class="border-outline-variant"/>
<span class="absolute left-1/2 -translate-x-1/2 -top-3 px-4 bg-surface-container-lowest font-label-md text-label-md text-outline">OR REGISTER WITH</span>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">

<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">
<img alt="Facebook" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZsb_dWqFbodXitqESf-EzIqaBFtcYzUVLb1PYASMK9Jw41sMslq4UYLaCvCGTEdr9cUynq2ILzjVgCiFu05zxi5IIcgfKtKJBDxLWmlEA8bsooZpkhBKt_Y9LFjDfR0pMi3a7HQIHDBBZf69n1x4ClnczbBOEbsDUr9vV1wsJJPaKreGjuNvPxgLfr5hr-MStzZrc7vEekyJfVuquzSA1cE-0r_H-IecUA1uPlrLqdEiQxyIMMHDK"/>
<span class="font-label-md text-label-md">Facebook</span>
</button>
</div>
</div>
</main>
<!-- Footer Trust Info -->
<footer class="py-6 px-margin-mobile text-center">
<div class="flex justify-center gap-6 mb-4">
<div class="flex items-center gap-1 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="font-label-md text-label-md">SSL Secured</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-sm">local_shipping</span>
<span class="font-label-md text-label-md">UK-wide Delivery</span>
</div>
</div>
<p class="font-label-md text-label-md text-outline">© 2024 BharatMart UK. Namaste and Happy Shopping.</p>
</footer>
<!-- Floating Atmosphere Elements -->
<div class="fixed top-20 -left-12 w-48 h-48 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-10 -right-12 w-64 h-64 bg-secondary/5 rounded-full blur-3xl -z-10"></div>
<!-- Micro-interactions Script -->
<script>
        // Simple tab switcher logic (visual only)
        const tabs = document.querySelectorAll('.bg-surface-container-low button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-surface-container-lowest', 'text-primary', 'font-bold', 'shadow-sm', 'border', 'border-outline-variant/20');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.remove('text-on-surface-variant');
                tab.classList.add('bg-surface-container-lowest', 'text-primary', 'font-bold', 'shadow-sm', 'border', 'border-outline-variant/20');
            });
        });

        // Form submission ripple effect placeholder
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            setTimeout(() => {
                btn.innerHTML = 'Create Account <span class="material-symbols-outlined">arrow_forward</span>';
            }, 2000);
        });
    </script>
</body></html>
